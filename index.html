<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Floating Music Player</title>

<style>

body{
    margin:0;
    padding:0;
    background:transparent;
    overflow:hidden;
}

.floating-music-player{
    position:fixed;

    right:20px;
    bottom:20px;

    width:64px;
    height:64px;

    border-radius:50%;

    background:rgba(255,255,255,0.95);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    cursor:pointer;

    z-index:999999999;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.2);

    transition:all .3s ease;
}

.floating-music-player:hover{
    transform:scale(1.08);
}

.floating-music-player.playing{
    animation:pulse 2s infinite;
}

@keyframes pulse{

    0%{
        box-shadow:
            0 0 0 0 rgba(180,140,120,.5),
            0 8px 25px rgba(0,0,0,.2);
    }

    70%{
        box-shadow:
            0 0 0 18px rgba(180,140,120,0),
            0 8px 25px rgba(0,0,0,.2);
    }

    100%{
        box-shadow:
            0 0 0 0 rgba(180,140,120,0),
            0 8px 25px rgba(0,0,0,.2);
    }

}

</style>
</head>

<body>

<audio id="bg-audio" loop>
    <source src="https://raw.githubusercontent.com/jonathanardono-devlabs/test-wedding-songs/main/a-thousand-years.mp3" type="audio/mpeg">
</audio>

<div class="floating-music-player" id="musicBtn">
    ♫
</div>

<script>

const audio = document.getElementById('bg-audio');
const btn = document.getElementById('musicBtn');

let playing = false;

btn.addEventListener('click', async () => {

    try{

        if(!playing){

            await audio.play();

            playing = true;

            btn.innerHTML = '❚❚';

            btn.classList.add('playing');

        }else{

            audio.pause();

            playing = false;

            btn.innerHTML = '♫';

            btn.classList.remove('playing');

        }

    }catch(err){
        console.log(err);
    }

});

</script>

</body>
</html>
